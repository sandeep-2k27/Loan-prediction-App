<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Prediction</title>

    <link rel="stylesheet" href="/static/style.css">

</head>


<body>


<div class="container">


    <div class="card">


        <h1>Loan Prediction</h1>

        <p class="subtitle">
            Enter applicant details to predict loan approval
        </p>


        <form action="/predict" method="post">


            <!-- Gender -->

            <label>Gender</label>

            <select name="gender" required>

                <option value="">Select Gender</option>

                <option value="Male">Male</option>

                <option value="Female">Female</option>

            </select>


            <!-- Married -->

            <label>Married</label>

            <select name="married" required>

                <option value="">Select</option>

                <option value="Yes">Yes</option>

                <option value="No">No</option>

            </select>


            <!-- Dependents -->

            <label>Dependents</label>

            <select name="dependents" required>

                <option value="">Select</option>

                <option value="0">0</option>

                <option value="1">1</option>

                <option value="2">2</option>

                <option value="3+">3+</option>

            </select>


            <!-- Education -->

            <label>Education</label>

            <select name="education" required>

                <option value="">Select</option>

                <option value="Graduate">
                    Graduate
                </option>

                <option value="Not Graduate">
                    Not Graduate
                </option>

            </select>


            <!-- Self Employed -->

            <label>Self Employed</label>

            <select name="self_employed" required>

                <option value="">Select</option>

                <option value="Yes">Yes</option>

                <option value="No">No</option>

            </select>


            <!-- Applicant Income -->

            <label>Applicant Income</label>

            <input
                type="number"
                name="applicant_income"
                placeholder="Enter applicant income"
                min="0"
                required
            >


            <!-- Coapplicant Income -->

            <label>Coapplicant Income</label>

            <input
                type="number"
                name="coapplicant_income"
                placeholder="Enter coapplicant income"
                min="0"
                value="0"
                required
            >


            <!-- Loan Amount -->

            <label>Loan Amount</label>

            <input
                type="number"
                name="loan_amount"
                placeholder="Enter loan amount"
                min="0"
                required
            >


            <!-- Loan Amount Term -->

            <label>Loan Amount Term</label>

            <input
                type="number"
                name="loan_amount_term"
                placeholder="Example: 360"
                min="0"
                required
            >


            <!-- Credit History -->

            <label>Credit History</label>

            <select name="credit_history" required>

                <option value="">
                    Select
                </option>

                <option value="1">
                    1 - Good
                </option>

                <option value="0">
                    0 - Bad
                </option>

            </select>


            <!-- Property Area -->

            <label>Property Area</label>

            <select name="property_area" required>

                <option value="">
                    Select
                </option>

                <option value="Rural">
                    Rural
                </option>

                <option value="Semiurban">
                    Semiurban
                </option>

                <option value="Urban">
                    Urban
                </option>

            </select>


            <!-- Button -->

            <button type="submit">

                Predict Loan

            </button>


        </form>


        {% if result %}

        <div class="result {{ result_class }}">

            {{ result }}

        </div>

        {% endif %}


    </div>


</div>


</body>

</html>
